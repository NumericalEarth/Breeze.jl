name: Validation

on:
  push:
    branches:
      - "main"
    paths: &paths
      - ".github/workflows/Validation.yml"
      - "examples/Project.jl"
      - "examples/boussinesq_bomex.jl"
      - "ext/**"
      - "src/**"
      - "Project.toml"
  pull_request:
    paths: *paths
  release:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'

jobs:
  validate:
    name: Validation - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12.6"
        os:
          - ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install Julia"
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - name: "Cache Julia depot"
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Instantiate examples environment
        shell: julia --color=yes --project=examples {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: Run BOMEX example
        env:
          VALIDATION: "true"
          CI: "true"
        run: |
          julia --color=yes --project=examples examples/boussinesq_bomex.jl
      - name: "Upload Manifest"
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: '**/Manifest*.toml'
          retention-days: 90
