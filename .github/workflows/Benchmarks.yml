name: Benchmarks

on:
  push:
    branches:
      - main
    paths: &paths
      - ".github/workflows/Benchmarks.yml"
      - "benchmarking/**"
      - "src/**"
      - "Project.toml"
  pull_request:
    paths: *paths

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Don't make Reactant occupy all the GPU memory
  XLA_REACTANT_GPU_PREALLOCATE: 'false'
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'

jobs:
  run-benchmarks:
    name: "Run benchmarks - dynamics ${{ matrix.dynamics }} - microphysics ${{ matrix.microphysics }} - grid ${{ matrix.grid }} - advection ${{ matrix.advection }} - backend ${{ matrix.backend }} - topology ${{ matrix.topology }}"
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: aws-linux-nvidia-gpu-l4
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY: only the kernel AD entry runs; restore the other entries before merging
          # Kernel AD: the AD job's model and checkpointed loop, differentiating the
          # kernel bodies themselves (--kernels kernelad, EnzymeAD/Reactant.jl#3472)
          # instead of the raised kernels. The pipeline's passes come from
          # EnzymeAD/Enzyme-JAX#3533, which no registered Reactant_jll has yet, so
          # this entry runs on the libReactantExtra of a "Build Reactant_jll" run on
          # that PR's branch (`enzyme_jax_branch`; see the steps below), with
          # Reactant.jl#3472 at a fixed commit (`reactant_rev`); every other entry
          # keeps the registered Reactant and Reactant_jll. Both sides are force-pushed
          # often, so `enzyme_jax_run` pins the build to the one `reactant_rev` was
          # written against (without it, the latest build of the branch is used):
          # Reactant.jl pb/kernel-ad 2099aba1 with Enzyme-JAX 9f77412c, the first build
          # of that kernel AD that registers the NVVM passes the CUDA pipeline needs.
          # `mode` keeps its artifact names apart from the AD job's, and while kernel AD is
          # experimental its failure does not fail the workflow or block publishing.
          # The Reactant.jl branch now needs Enzyme-JAX options the registered
          # Reactant_jll lacks (preserve-xla-funcs), so it must not reach other jobs.
          - dynamics: 'compressible_splitexplicit'
            microphysics: 'nothing'
            grid: '128x128x32'
            advection: 'WENO5'
            backend: 'reactant'
            topology: 'PBB'
            mode: 'kernelad'
            enzyme_jax_branch: 'pb/kernel-ad'
            enzyme_jax_run: '40917264751'
            reactant_rev: '2099aba10460a94962cfa1fd8a7ca4c717140c2b'
            # TEMPORARY: dump every MLIR pass pipeline to find where the compile corrupts the heap
            dump_mlir: 'mlir_dumps'
            timeout: 60
            extra_flags: '--ad --simplified --float_type=Float32 --warmup_steps 1 --time_steps 64 --checkpoints 2,8 --checkpointing_mode binomial --kernels kernelad'
    defaults:
      run:
        shell: bash
        working-directory: ./benchmarking
    container:
      image: 'ghcr.io/numericalearth/breeze-docker-images:benchmarking-julia_1.13.2'
      options: --gpus=all
      volumes:
        # Mount host `/usr/local` so that we can delete some stuff afterwards
        - /usr/local:/host-usr-local
    timeout-minutes: ${{ matrix.timeout || 30 }}
    continue-on-error: ${{ matrix.mode == 'kernelad' }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: df before cleanup
        run: |
          df -hT
      - name: Clean up old CUDA toolkits
        # Save storage by deleting old CUDA toolkits, we'll use v13
        run: |
          rm -rf /host-usr-local/cuda-12.*
      - name: df after cleanup
        run: |
          df -hT
      - name: Find the Enzyme-JAX Reactant_jll build
        # The newest successful "Build Reactant_jll" run on the Enzyme-JAX branch whose
        # products have not expired (they are kept for a couple of days). The image has
        # neither curl nor gh, so Julia's Downloads fetches the API.
        if: ${{ matrix.enzyme_jax_branch }}
        id: enzyme_jax_build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: 'products-x86_64-linux-gnu-cxx11-gpu_version+13.1-gpu+cuda-mode+opt'
        run: |
          github_api() {
              julia --startup-file=no -e 'using Downloads; Downloads.download(ARGS[1], stdout; headers = ["Authorization" => "Bearer " * ENV["GH_TOKEN"], "Accept" => "application/vnd.github+json"])' "https://api.github.com/repos/EnzymeAD/Enzyme-JAX/$1"
          }
          if [[ -n "${{ matrix.enzyme_jax_run }}" ]]; then
              runs="$(github_api "actions/runs/${{ matrix.enzyme_jax_run }}" | jq -r '"\(.id) \(.head_sha)"')"
          else
              runs="$(github_api "actions/workflows/build-reactantjll.yml/runs?branch=${{ matrix.enzyme_jax_branch }}&status=success&per_page=10" | jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          fi
          while read -r run_id sha; do
              [[ -n "${run_id}" ]] || continue
              # `+` must be percent-encoded in the query, or it reads as a space
              if github_api "actions/runs/${run_id}/artifacts?name=${ARTIFACT//+/%2B}" < /dev/null | jq -e '[.artifacts[] | select(.expired | not)] | length > 0' > /dev/null; then
                  echo "Using Enzyme-JAX run ${run_id} (commit ${sha}) of ${{ matrix.enzyme_jax_branch }}"
                  echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
                  exit 0
              fi
          done <<< "${runs}"
          echo "No unexpired ${ARTIFACT} on Enzyme-JAX's ${{ matrix.enzyme_jax_branch }}: rerun its Build Reactant_jll workflow" >&2
          exit 1
      - name: Download the Enzyme-JAX Reactant_jll build
        if: ${{ matrix.enzyme_jax_branch }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 'products-x86_64-linux-gnu-cxx11-gpu_version+13.1-gpu+cuda-mode+opt'
          repository: EnzymeAD/Enzyme-JAX
          run-id: ${{ steps.enzyme_jax_build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reactant_jll_products
      - name: Use the Enzyme-JAX libReactantExtra
        # Unpack the build (lib/libReactantExtra.so with its lib/cuda next to it) and point
        # Reactant_jll's libReactantExtra at it in the image's @breeze preferences, which
        # list Reactant_jll; before instantiating, so everything compiles against it
        if: ${{ matrix.enzyme_jax_branch }}
        working-directory: .
        run: |
          ls -l reactant_jll_products
          mkdir -p reactant_jll
          # The image has no xz; Pkg unpacks the .tar.xz with the p7zip that ships with Julia
          julia --startup-file=no -e 'using Pkg; Pkg.PlatformEngines.unpack(ARGS[1], ARGS[2])' \
              reactant_jll_products/Reactant.v*.tar.* reactant_jll
          lib="${GITHUB_WORKSPACE}/reactant_jll/lib/libReactantExtra.so"
          ls -l "${lib}"
          julia --startup-file=no -e '
              using TOML
              file = "/usr/local/share/julia/environments/breeze/LocalPreferences.toml"
              preferences = TOML.parsefile(file)
              preferences["Reactant_jll"]["libReactantExtra_path"] = ARGS[1]
              open(io -> TOML.print(io, preferences), file, "w")
              print(read(file, String))' "${lib}"
      - name: Use Reactant.jl's kernel AD branch
        # Reactant.jl#3472 at `reactant_rev`, for the entry whose Reactant_jll build matches it
        if: ${{ matrix.reactant_rev }}
        shell: julia --color=yes --project {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          # `reactant_rev` fixes Reactant here, and the branch's version can lag the project's
          # exact Reactant compat, so drop the bound for this entry. `Pkg.compat` checks the
          # manifest against `[sources]`, so resolve first: the manifest is gitignored
          Pkg.resolve()
          Pkg.compat("Reactant", nothing)
          Pkg.add(url = "https://github.com/EnzymeAD/Reactant.jl", rev = "${{ matrix.reactant_rev }}")
      - name: Instantiate benchmarking environment
        shell: julia --color=yes --project {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: Start earlyoom
        id: earlyoom
        run: |
          earlyoom -m 2 -s 100 -r 60 --prefer 'julia'
        background: true
      - name: Run benchmarks
        timeout-minutes: ${{ matrix.timeout || 45 }}
        env:
          XLA_FLAGS: '--xla_disable_hlo_passes=multi_output_fusion'
          BREEZE_DUMP_MLIR: ${{ matrix.dump_mlir }}
        run: |
          julia --color=yes --project run_benchmarks.jl --device GPU --dynamics "${{ matrix.dynamics }}" --microphysics "${{ matrix.microphysics }}" --advection "${{ matrix.advection }}" --size "${{ matrix.grid }}" --backend "${{ matrix.backend }}" --topology "${{ matrix.topology }}" --warmup_steps 8 --time_steps 80 ${{ matrix.extra_flags }}
      - name: Stop earlyoom
        cancel: earlyoom
      - name: "Upload benchmark results as artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'benchmarks-dynamics_${{ matrix.dynamics }}-microphysics_${{ matrix.microphysics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: benchmarking/benchmark_results.*
          retention-days: 90
          overwrite: false
      - name: "Upload MLIR dumps as artifacts"
        # Only the tendency / model_tendency matrix entries and those with `dump_mlir`
        # dump MLIR (Reactant backend); other entries produce no files and are skipped.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'mlir-dumps-dynamics_${{ matrix.dynamics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: benchmarking/mlir_dumps/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: "Upload profiles as artifacts"
        # Only the tendency / model_tendency matrix entries write xprof profiles
        # (Reactant backend); other entries produce no files and are skipped.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'profiles-dynamics_${{ matrix.dynamics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: benchmarking/profiles/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: "Upload Manifest"
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'manifest-dynamics_${{ matrix.dynamics }}-microphysics_${{ matrix.microphysics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: '**/Manifest*.toml'
          retention-days: 90
          overwrite: false
      - name: Create job summary
        timeout-minutes: 1
        run:
          cat "benchmark_results.md" >> "${GITHUB_STEP_SUMMARY}"

  publish-benchmarks:
    name: "Publish benchmarks"
    needs: run-benchmarks
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Download benchmark results"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmarks-*
      - name: Merge results and create JSON for github-action-benchmark
        shell: python
        run: |
          # Merge benchmark_results.json from all artifact directories,
          # then create the JSON file for github-action-benchmark.
          import json, glob

          all_data = []
          for path in sorted(glob.glob('benchmarks-*/benchmark_results.json')):
              with open(path) as f:
                  all_data.extend(json.load(f))

          # Write merged results for archival
          with open('benchmark_results.json', 'w') as f:
              json.dump(all_data, f, ensure_ascii=False, indent=2)

          # Build github-action-benchmark entries
          # Name format: <name>/<properties>/<gpu>/<grid_size>
          data = []
          compile_data = []
          for d in all_data:
              base_name = d['name'].split('_')[0]
              advection = d['advection']
              # Closure is unused for the time being because it's always the
              # same everywhere in the current setup.
              closure = d['closure']
              dynamics = d['dynamics']
              ft = d['float_type']
              microphysics = d['microphysics']
              backend = d.get('backend', 'vanilla')
              mode = d.get('mode', 'forward')
              checkpointing = d.get('checkpointing', '')

              gpu = d['metadata']['gpu_name']

              versions = d['metadata'].get('package_versions', {})
              extra = ', '.join(
                  f"{p} v{versions.get(p, 'unknown')}"
                  for p in ('Oceananigans', 'CUDA', 'GPUCompiler', 'Reactant', 'Reactant_jll')
              )

              grid = d['grid_size']
              grid_str = f"{grid[0]}x{grid[1]}x{grid[2]}"

              # AD (forward+backward via Enzyme) entries get their own chart,
              # one line per checkpointing strategy. Skip the forward-only
              # clauses below so an AD point doesn't also land on a forward
              # chart that happens to match its config.
              if mode == 'ad':
                  level_1 = f'{base_name}; AD; Dynamics: {dynamics}; Microphysics: {microphysics} [{ft}]'
                  level_2 = f'Advection: {advection}'
                  level_3 = f'{gpu}'
                  # Kernel AD (backend 'reactant kernelad') gets its own line next to raising
                  kernels = backend.removeprefix('reactant').strip()
                  level_4 = f'{grid_str} {checkpointing} {kernels}'.strip()

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})

                  # The forward+backward compile, one panel per checkpointing strategy and one line per
                  # stage, next to the tendency compile times
                  if d.get('compile_tracing_time_seconds', 0) > 0:
                      level_1 = f'Reactant compile time; AD; Advection: {advection}; Grid: {grid_str}'
                      level_2 = f'{base_name} {checkpointing}'.strip()
                      level_3 = f'{gpu}'
                      for stage in ('tracing', 'mlir', 'xla'):
                          name = f"{level_1}/{level_2}/{level_3}/{stage}"
                          compile_data.append({'name': name, 'unit': 's', 'value': d[f'compile_{stage}_time_seconds'], 'extra': extra})
                  continue

              # Scalar-tendency kernel sweep (no model): compare WENO orders on
              # a fixed grid. Reuses BenchmarkResult with mode == 'tendency';
              # closure/dynamics/microphysics are 'none', so skip the forward
              # clauses below via continue.
              if mode in ('scalar_tendency', 'model_tendency'):
                  # One figure per case (ScalarTendency / ModelTendency), one
                  # side-by-side panel per WENO order, and one line per
                  # float-type × backend config. Scalar gets 4 lines (Float32 /
                  # BFloat16 × vanilla / reactant); model gets 2 (Float32 only,
                  # since it has no BFloat16 rows).
                  ft_short = {'Float32': 'F32', 'BFloat16': 'BF16', 'Float64': 'F64'}.get(ft, ft)
                  level_1 = f'{base_name}; Grid: {grid_str}'
                  level_2 = f'Advection: {advection}'
                  level_3 = f'{gpu}'
                  level_4 = f'{ft_short} {backend}'

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})

                  if advection == 'WENO5' and d.get('compile_tracing_time_seconds', 0) > 0:
                      level_1 = f'Reactant compile time; Advection: {advection}; Grid: {grid_str}'
                      level_2 = f'{base_name} {ft_short} {backend}'
                      level_3 = f'{gpu}'
                      for stage in ('tracing', 'mlir', 'xla'):
                          name = f"{level_1}/{level_2}/{level_3}/{stage}"
                          compile_data.append({'name': name, 'unit': 's', 'value': d[f'compile_{stage}_time_seconds'], 'extra': extra})
                  continue

              # We want to group benchmarks in different ways. NOTE:
              # the same benchmark may appear in multiple groups
              if dynamics == 'anelastic' and grid_str == '512x512x256' and advection == 'WENO5':
                  level_1 = f'{base_name}; Dynamics: {dynamics}; Grid: {grid_str} [{ft}]'
                  level_2 = f'Advection: {advection}'
                  level_3 = f'{gpu}'
                  level_4 = f'{microphysics}'

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})
                  pass

              if dynamics == 'anelastic' and microphysics == 'nothing':
                  level_1 = f'{base_name}; Dynamics: {dynamics}; Microphysics: {microphysics} [{ft}]'
                  level_2 = f'Compare advections'
                  level_3 = f'{gpu}'
                  level_4 = f'{advection} {grid}'

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})
                  pass

              # The Reactant vs vanilla sweep is the only forward case on a
              # LatitudeLongitudeGrid, which the result name marks with _LatLon.
              latlon = '_LatLon' in d['name']

              # Without the latlon check the vanilla and Reactant points of the
              # sweep would share a name here.
              if microphysics == 'nothing' and not latlon:
                  level_1 = f'{base_name}; Dynamics: {dynamics}; Microphysics: {microphysics} [{ft}]'
                  level_2 = f'Advection: {advection}'
                  level_3 = f'{gpu}'
                  level_4 = f'{grid_str}'

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})

              # Reactant vs vanilla sweep: compare backends across grid sizes
              # on the AD job's physics (LatitudeLongitudeGrid, split-explicit
              # dynamics, WENO5, no microphysics).
              if latlon and advection == 'WENO5':
                  level_1 = f'{base_name}; LatitudeLongitudeGrid; Dynamics: {dynamics}; Microphysics: {microphysics} [{ft}]'
                  level_2 = f'Compare backends'
                  level_3 = f'{gpu}'
                  level_4 = f'{backend} {grid_str}'

                  name = f"{level_1}/{level_2}/{level_3}/{level_4}"
                  data.append({'name': name, 'unit': 'points/s', 'value': d['grid_points_per_second'], 'extra': extra})

          with open('github-action-benchmark.json', 'w') as f:
              json.dump(data, f)

          if compile_data:
              with open('github-action-benchmark-compile.json', 'w') as f:
                  json.dump(compile_data, f)
      - name: "Generate token"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        id: generate_token
        with:
          client-id: "${{ secrets.NUMTERRA_BOT_ID }}"
          private-key: "${{ secrets.NUMTERRA_BOT_PRIVATE_KEY }}"
          owner: NumericalEarth
          repositories: |
            Breeze.jl
            BreezeBenchmarks
      - name: Push results to BreezeBenchmarks repo
        if: ${{ github.event_name == 'push' }}
        run: |
          # Clone BreezeBenchmarks
          git clone https://numterra-bot:${{ steps.generate_token.outputs.token }}@github.com/NumericalEarth/BreezeBenchmarks.git
          cd BreezeBenchmarks
          DIRNAME="benchmarks/by_branch/${{ github.head_ref || github.ref_name }}/${{ github.sha }}"
          mkdir -vp "${DIRNAME}"
          # Copy over file
          cp -v ../benchmark_results.json "${DIRNAME}/."
          # Push
          git config --global user.name "numterra-bot[bot]"
          git config --global user.email "242463128+numterra-bot[bot]@users.noreply.github.com"
          git add .
          git commit -m'Save benchmark results for commit ${{ github.sha }}'
          git push -u origin main
      - name: "Publish benchmark results"
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Breeze.jl Benchmarks
          tool: "customBiggerIsBetter"
          output-file-path: "github-action-benchmark.json"
          # benchmark-data-dir-path: ${{ github.event_name == 'push' && '.' || format('previews/PR{0}', github.event.number) }}
          benchmark-data-dir-path: "."
          gh-repository: "github.com/NumericalEarth/BreezeBenchmarks"
          github-token: ${{ github.event.pull_request.head.repo.fork && github.token || steps.generate_token.outputs.token }}
          comment-always: ${{ github.event_name == 'pull_request' }}
          summary-always: true
          alert-threshold: "110%"
          fail-on-alert: false
          # auto-push: true
          auto-push: ${{ github.event_name == 'push' }}
          max-items-in-chart: 1000
          comment-on-alert: true
      - name: "Clean up benchmark data clone"
        if: ${{ hashFiles('github-action-benchmark-compile.json') != '' }}
        run: rm -rf benchmark-data-repository
      - name: "Publish compile times"
        if: ${{ hashFiles('github-action-benchmark-compile.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Breeze.jl Compile Times
          tool: "customSmallerIsBetter"
          output-file-path: "github-action-benchmark-compile.json"
          benchmark-data-dir-path: "."
          gh-repository: "github.com/NumericalEarth/BreezeBenchmarks"
          github-token: ${{ github.event.pull_request.head.repo.fork && github.token || steps.generate_token.outputs.token }}
          comment-always: false
          summary-always: true
          # Compile times are noisier than run times
          alert-threshold: "150%"
          fail-on-alert: false
          auto-push: ${{ github.event_name == 'push' }}
          max-items-in-chart: 1000
          comment-on-alert: false
