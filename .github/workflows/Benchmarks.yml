name: Benchmarks

on:
  push:
    branches:
      - main
    paths: &paths
      - ".github/workflows/Benchmarks.yml"
      - "benchmarking/**"
      - "src/**"
      - "Project.toml"
  pull_request:
    paths: *paths

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Don't make Reactant occupy all the GPU memory
  XLA_REACTANT_GPU_PREALLOCATE: 'false'
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'

jobs:
  run-benchmarks:
    name: "Run benchmarks - dynamics ${{ matrix.dynamics }} - microphysics ${{ matrix.microphysics }} - grid ${{ matrix.grid }} - advection ${{ matrix.advection }} - backend ${{ matrix.backend }} - topology ${{ matrix.topology }}"
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: aws-linux-nvidia-gpu-l4
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY: only the kernel AD entry runs, and the "Publish benchmarks" job is
          # removed with it; restore both from main before merging
          # Kernel AD: the AD job's model and loop, differentiating the kernel bodies
          # themselves (--kernels kernelad, EnzymeAD/Reactant.jl#3472) instead of the
          # raised kernels. The pipeline's passes come from EnzymeAD/Enzyme-JAX#3533, which
          # no registered Reactant_jll has, so this entry takes the Reactant_jll that
          # Reactant.jl#3472 itself sources: Pangoraw/Reactant_jll.jl (`reactant_jll_url`,
          # `reactant_jll_rev`), whose builds are GitHub release assets and do not expire
          # (the "Build Reactant_jll" products of the Enzyme-JAX branch used before lapsed
          # after two days). Its newest build, 0.0.435+4 of 2026-10-29, is x86_64 Linux with
          # CUDA 12.9 only (`reactant_jll_gpu_version`; the image's preference is 13.1), and
          # predates Enzyme-JAX's rename of kernel-call-to-gpu-wrapper to
          # lower-kernel-to-polygeist, which Reactant.jl pb/kernel-ad f439eef3
          # (`reactant_rev`: upstream main at 025e4a59, Reactant 0.2.304) uses, so the job
          # renames the pass back in its copy of Reactant.jl and relaxes Reactant's
          # Reactant_jll compat (0.0.438) to that build; drop both once a newer build is
          # published. Every other entry keeps the registered Reactant and Reactant_jll.
          # `mode` keeps its artifact names apart from the AD job's.
          - dynamics: 'compressible_splitexplicit'
            microphysics: 'nothing'
            grid: '128x128x32'
            advection: 'WENO5'
            backend: 'reactant'
            topology: 'PBB'
            mode: 'kernelad'
            reactant_rev: 'f439eef39171e3225908be5722367aee6f24a29d'
            reactant_jll_url: 'https://github.com/Pangoraw/Reactant_jll.jl'
            reactant_jll_rev: '11cfdcccc9beede4ecce01a5e913a465baabb33e'
            reactant_jll_gpu_version: '12.9'
            reactant_jll_compat: '0.0.435'
            # TEMPORARY: the kernel AD pipeline's convert-parallel-to-gpu1{emit_single_alternative=true}
            # rebuilds each launch from its original shape, which lower-kernel-to-polygeist does not
            # record: every kernel got one thread per block, and a kernel whose loop was delinearized
            # into 4 dimensions failed with "no block size splits this kernel". Without the option,
            # POLYGEIST_GPU_KERNEL_BLOCK_SIZE picks each kernel's block from its loop bounds instead.
            kernelad_block_size: '256'
            # TEMPORARY: dump every MLIR pass pipeline to check the launch shapes of the compiled kernels
            dump_mlir: 'mlir_dumps'
            timeout: 60
            # TEMPORARY: the AD job's window is 64 steps with binomial checkpointing (2 and 8).
            # Under kernel AD each kernel launch of the loop body becomes its own jit region, and
            # checkpointing clones the body: the 675 launches of the forward program became 2538 regions
            # (2879 GPU modules), which lower-jit compiles one by one, keeping roughly 10 MiB each,
            # until the 30 GiB runner killed Julia at 29 GiB (run 41965836851). Without
            # checkpointing the reverse pass holds the forward and the reverse body only, about
            # half the regions, and 8 steps keep the whole tape on the GPU. Restore the AD job's
            # window once Enzyme-JAX shares identical regions or frees them after compiling.
            extra_flags: '--ad --simplified --float_type=Float32 --warmup_steps 1 --time_steps 8 --checkpoints none --kernels kernelad'
    defaults:
      run:
        shell: bash
        working-directory: ./benchmarking
    container:
      image: 'ghcr.io/numericalearth/breeze-docker-images:benchmarking-julia_1.13.2'
      options: --gpus=all
      volumes:
        # Mount host `/usr/local` so that we can delete some stuff afterwards
        - /usr/local:/host-usr-local
    timeout-minutes: ${{ matrix.timeout || 30 }}
    # TEMPORARY: with the kernel AD entry alone, its result is the workflow's; restore
    # `continue-on-error: ${{ matrix.mode == 'kernelad' }}` with the other entries
    continue-on-error: false
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: df before cleanup
        run: |
          df -hT
      - name: Clean up old CUDA toolkits
        # Save storage by deleting old CUDA toolkits, we'll use v13
        run: |
          rm -rf /host-usr-local/cuda-12.*
      - name: df after cleanup
        run: |
          df -hT
      - name: Use the kernel AD Reactant_jll's CUDA version
        # Reactant_jll picks its artifact by the `gpu_version` preference in the image's
        # @breeze environment, which lists Reactant_jll; the kernel AD build has one
        # CUDA version, so the preference follows it. Before instantiating, so everything
        # compiles against it
        if: ${{ matrix.reactant_jll_url }}
        working-directory: .
        run: |
          julia --startup-file=no -e '
              using TOML
              file = "/usr/local/share/julia/environments/breeze/LocalPreferences.toml"
              preferences = TOML.parsefile(file)
              preferences["Reactant_jll"]["gpu_version"] = ARGS[1]
              delete!(preferences["Reactant_jll"], "libReactantExtra_path")
              open(io -> TOML.print(io, preferences), file, "w")
              print(read(file, String))' "${{ matrix.reactant_jll_gpu_version }}"
      - name: Use Reactant.jl's kernel AD branch
        # Reactant.jl#3472 at `reactant_rev`, for the entry whose Reactant_jll build matches it
        if: ${{ matrix.reactant_rev }}
        shell: julia --color=yes --project {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          # `reactant_rev` fixes Reactant here, and the branch's version can lag the project's
          # exact Reactant compat, so drop the bound for this entry. `Pkg.compat` checks the
          # manifest against `[sources]`, so resolve first: the manifest is gitignored.
          # The image rebuilt on 2026-11-05 has no registry, which `resolve` does not install
          isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add("General")
          Pkg.resolve()
          Pkg.compat("Reactant", nothing)
          Pkg.add(url = "https://github.com/EnzymeAD/Reactant.jl", rev = "${{ matrix.reactant_rev }}")
      - name: Patch the kernel AD branch for the block size and the Reactant_jll build
        # Develop a copy of the Reactant.jl branch whose kernel AD pipeline runs
        # convert-parallel-to-gpu1 without emit_single_alternative, so that the
        # POLYGEIST_GPU_KERNEL_BLOCK_SIZE set for the run below takes effect, and whose
        # pipeline and compat fit the kernel AD Reactant_jll build (see the entry); then
        # add that build
        if: ${{ matrix.kernelad_block_size || matrix.reactant_jll_url }}
        shell: julia --color=yes --project {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          installed = only(p for p in values(Pkg.dependencies()) if p.name == "Reactant").source
          reactant = joinpath(ENV["GITHUB_WORKSPACE"], "Reactant.jl")
          cp(installed, reactant; force = true)
          chmod(reactant, 0o755; recursive = true)
          function replace_once!(file, old, new)
              source = read(file, String)
              count(old, source) == 1 || error("expected one $old in $file")
              write(file, replace(source, old => new))
          end
          compiler = joinpath(reactant, "src", "compiler", "Compiler.jl")
          if !isempty("${{ matrix.kernelad_block_size }}")
              replace_once!(compiler, "convert-parallel-to-gpu1{emit_single_alternative=true}", "convert-parallel-to-gpu1")
          end
          if !isempty("${{ matrix.reactant_jll_url }}")
              # TEMPORARY: the published build predates the pass's rename
              replace_once!(compiler, "lower-kernel-to-polygeist", "kernel-call-to-gpu-wrapper")
              replace_once!(joinpath(reactant, "Project.toml"), "Reactant_jll = \"0.0.438\"", "Reactant_jll = \"${{ matrix.reactant_jll_compat }}\"")
          end
          Pkg.develop(path = reactant)
          run(`grep -nE "convert-parallel-to-gpu1|kernel-call-to-gpu-wrapper|lower-kernel-to-polygeist" $compiler`)
          if !isempty("${{ matrix.reactant_jll_url }}")
              Pkg.add(url = "${{ matrix.reactant_jll_url }}", rev = "${{ matrix.reactant_jll_rev }}")
          end
      - name: Instantiate benchmarking environment
        shell: julia --color=yes --project {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: Start earlyoom
        id: earlyoom
        run: |
          earlyoom -m 2 -s 100 -r 60 --prefer 'julia'
        background: true
      - name: Run benchmarks
        timeout-minutes: ${{ matrix.timeout || 45 }}
        env:
          XLA_FLAGS: '--xla_disable_hlo_passes=multi_output_fusion'
          BREEZE_DUMP_MLIR: ${{ matrix.dump_mlir }}
        run: |
          # An empty POLYGEIST_GPU_KERNEL_BLOCK_SIZE would still be read, as a block size of 0
          if [[ -n "${{ matrix.kernelad_block_size }}" ]]; then
              export POLYGEIST_GPU_KERNEL_BLOCK_SIZE="${{ matrix.kernelad_block_size }}"
          fi
          julia --color=yes --project run_benchmarks.jl --device GPU --dynamics "${{ matrix.dynamics }}" --microphysics "${{ matrix.microphysics }}" --advection "${{ matrix.advection }}" --size "${{ matrix.grid }}" --backend "${{ matrix.backend }}" --topology "${{ matrix.topology }}" --warmup_steps 8 --time_steps 80 ${{ matrix.extra_flags }} ${{ matrix.profile_kernels && '--profile_kernels' || '' }}
      - name: Stop earlyoom
        cancel: earlyoom
      - name: "Upload benchmark results as artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'benchmarks-dynamics_${{ matrix.dynamics }}-microphysics_${{ matrix.microphysics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: |
            benchmarking/benchmark_results.*
            benchmarking/kernel_profile.*
          retention-days: 90
          overwrite: false
      - name: "Upload MLIR dumps as artifacts"
        # Only the tendency / model_tendency matrix entries and those with `dump_mlir`
        # dump MLIR (Reactant backend); other entries produce no files and are skipped.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'mlir-dumps-dynamics_${{ matrix.dynamics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: benchmarking/mlir_dumps/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: "Upload profiles as artifacts"
        # Only the tendency / model_tendency matrix entries write xprof profiles
        # (Reactant backend); other entries produce no files and are skipped.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'profiles-dynamics_${{ matrix.dynamics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: benchmarking/profiles/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: "Upload Manifest"
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'manifest-dynamics_${{ matrix.dynamics }}-microphysics_${{ matrix.microphysics }}-grid_${{ matrix.grid }}-advection_${{ matrix.advection }}-backend_${{ matrix.backend }}-topology_${{ matrix.topology }}-${{ matrix.mode }}'
          path: '**/Manifest*.toml'
          retention-days: 90
          overwrite: false
      - name: Create job summary
        timeout-minutes: 1
        run: |
          cat "benchmark_results.md" >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "kernel_profile.md" ]; then cat "kernel_profile.md" >> "${GITHUB_STEP_SUMMARY}"; fi
