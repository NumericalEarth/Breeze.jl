name: Kernel AD launch shape

# TEMPORARY: reproduces, without a GPU, why the kernel AD benchmark needs `kernelad_block_size`
# (see Benchmarks.yml): Enzyme-JAX's convert-parallel-to-gpu1{emit_single_alternative=true} gives
# kernels one thread per block, and drops a kernel whose loop was delinearized into 4 dimensions

permissions:
  actions: read
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/KernelADLaunchShape.yml'
      - 'benchmarking/kernelad_launch_shape/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The kernel AD entry of Benchmarks.yml's `enzyme_jax_branch` and `reactant_rev`. The pass is
  # target independent, so the branch's macOS CPU build will do; like the benchmark, this takes
  # the newest build whose products have not expired (they are kept for about two days)
  ENZYME_JAX_BRANCH: 'pb/kernel-ad'
  REACTANT_REV: 'f439eef39171e3225908be5722367aee6f24a29d'
  ARTIFACT: 'products-aarch64-apple-darwin-gpu_version+none-gpu+none-mode+opt'

jobs:
  launch-shape:
    name: convert-parallel-to-gpu1 on a delinearized KernelAbstractions launch
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the Enzyme-JAX Reactant_jll build
        # The newest successful "Build Reactant_jll" run on the branch whose macOS products
        # have not expired, as Benchmarks.yml finds its CUDA build
        id: enzyme_jax_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/EnzymeAD/Enzyme-JAX/actions/workflows/build-reactantjll.yml/runs?branch=${ENZYME_JAX_BRANCH}&status=success&per_page=10" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          while read -r run_id sha; do
              [[ -n "${run_id}" ]] || continue
              # `+` must be percent-encoded in the query, or it reads as a space
              if gh api "repos/EnzymeAD/Enzyme-JAX/actions/runs/${run_id}/artifacts?name=${ARTIFACT//+/%2B}" \
                      --jq '[.artifacts[] | select(.expired | not)] | length > 0' | grep -q true; then
                  echo "Using Enzyme-JAX run ${run_id} (commit ${sha}) of ${ENZYME_JAX_BRANCH}"
                  echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
                  exit 0
              fi
          done <<< "${runs}"
          echo "No unexpired ${ARTIFACT} on Enzyme-JAX's ${ENZYME_JAX_BRANCH}: rerun its Build Reactant_jll workflow" >&2
          exit 1
      - name: Download the Enzyme-JAX Reactant_jll build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT }}
          repository: EnzymeAD/Enzyme-JAX
          run-id: ${{ steps.enzyme_jax_build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reactant_jll_products
      - name: Unpack the Enzyme-JAX libReactantExtra
        run: |
          mkdir -p reactant_jll
          tar -xJf reactant_jll_products/Reactant.v*.tar.* -C reactant_jll
          ls -l reactant_jll/lib/libReactantExtra.dylib
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.11.9'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Make an environment with Reactant.jl's kernel AD branch
        # The preference goes in before anything precompiles, so Reactant compiles against it;
        # Reactant_jll is a direct dependency so that the project's preferences reach it
        shell: julia --color=yes --project=launch_shape_env {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg, TOML
          lib = joinpath(ENV["GITHUB_WORKSPACE"], "reactant_jll", "lib", "libReactantExtra.dylib")
          mkpath("launch_shape_env")
          open(io -> TOML.print(io, Dict("Reactant_jll" => Dict("libReactantExtra_path" => lib))),
               joinpath("launch_shape_env", "LocalPreferences.toml"), "w")
          Pkg.add([PackageSpec(url = "https://github.com/EnzymeAD/Reactant.jl", rev = ENV["REACTANT_REV"]),
                   PackageSpec(name = "Reactant_jll"), PackageSpec(name = "Test")])
          Pkg.precompile()
          Pkg.status()
      - name: Run convert-parallel-to-gpu1
        run: |
          julia --color=yes --project=launch_shape_env \
              benchmarking/kernelad_launch_shape/launch_shape.jl \
              benchmarking/kernelad_launch_shape/launch_shape.mlir
