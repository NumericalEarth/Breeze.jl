# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

# To be able to manage the Julia ecosystem for the time being
enable-beta-ecosystems: true

updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,3,5" # Monday, Wednesday and Friday at 09:00 UTC
    labels:
      - "dependencies 🖇️"
    cooldown:
      default-days: 15
  - package-ecosystem: "julia"
    # Location of Julia projects
    directories:
      - "/"
      - "/benchmarking"
      - "/docs"
      - "/examples"
      - "/test"
      - "/utils/p3-artifacts"
      - "/validation"
      - "/validation/DCMIP2016_TC"
      - "/validation/cloud_les_library"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,3,5" # Monday, Wednesday and Friday at 09:00 UTC
    ignore:
      # Ignore package itself
      - dependency-name: "Breeze"
      # Ignore Reactant, we handle it manually
      - dependency-name: "Reactant"
    labels:
      - "dependencies 🖇️"
    groups:
      per-dependency:
        group-by: dependency-name
